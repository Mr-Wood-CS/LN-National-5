<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" width="400" height="372" role="img" aria-labelledby="title">
  <title id="title">Flowchart for retrying an incorrect password</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="400" height="372" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <path d="M240 62V94"/>
    <path d="M240 140V172"/>
    <path d="M240 264V308"/>
    <path d="M120 218H42V117H161"/>
  </g>
  <g stroke="#334155" stroke-width="2" fill="#fff">
    <rect x="180" y="22" width="120" height="40" rx="20"/>
    <path d="M172 94H330L308 140H150Z"/>
    <path d="M240 172L360 218L240 264L120 218Z" fill="#dbeafe"/>
    <rect x="151" y="308" width="178" height="42" rx="21"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle">
    <text x="240" y="48">Start</text>
    <text x="240" y="123">Enter password</text>
    <text x="240" y="215">Is the password</text>
    <text x="240" y="235">correct?</text>
    <text x="240" y="335">Continue</text>
    <text x="88" y="209" font-size="15">No</text>
    <text x="264" y="290" font-size="15">Yes</text>
  </g>
</svg>
