<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 302" width="640" height="302" role="img" aria-labelledby="title">
  <title id="title">Structure diagram for totalling five numbers</title>
  <rect width="640" height="302" fill="white"/>
  <g fill="white" stroke="#222" stroke-width="2">
    <path d="M320 76V128 M98 128V102H542V128 M320 180V203 M219 226V203H434V226" fill="none"/>
    <rect x="192" y="24" width="256" height="52" rx="0"/>
    <rect x="20" y="128" width="156" height="52" rx="0"/>
    <rect x="210" y="128" width="220" height="52" rx="26"/>
    <rect x="464" y="128" width="156" height="52" rx="0"/>
    <rect x="146" y="226" width="146" height="52" rx="0"/>
    <rect x="348" y="226" width="172" height="52" rx="0"/>
  </g>
  <g fill="#111" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle">
    <text x="320" y="56">Total five numbers</text>
